name: Build and Release

on:
  push:
    tags: [ 'v*' ]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed for creating/uploading releases

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so the changelog can diff against the previous tag

      - name: Run tests
        run: make test

      - name: Build
        run: make release

      - name: Verify static linking
        run: |
          file fancontrol
          if ldd fancontrol 2>&1 | grep -q '=>'; then
            echo "ERROR: binary is dynamically linked"; exit 1
          fi

      - name: Package release tarball
        run: tar czf fancontrol-linux-x86_64.tar.gz fancontrol fancontrol.conf fancontrol.service install_service.sh

      - name: Generate Changelog
        id: changelog
        run: |
          # Previous tag (excluding the one being released)
          PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found. Listing all commits."
            LOG=$(git log --oneline)
          else
            echo "Previous tag is $PREV_TAG. Listing commits from $PREV_TAG to HEAD."
            LOG=$(git log --oneline "$PREV_TAG"..HEAD)
          fi

          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$LOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.changelog }}
          files: |
            fancontrol
            fancontrol-linux-x86_64.tar.gz
