name: Build and Release

on:
  push:
    tags: [ 'v*' ]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed for creating/uploading releases

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so the changelog can diff against the previous tag

      - name: Run tests
        run: make test

      - name: Build
        run: make

      - name: Generate Changelog
        id: changelog
        run: |
          # Previous tag (excluding the one being released)
          PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found. Listing all commits."
            LOG=$(git log --oneline)
          else
            echo "Previous tag is $PREV_TAG. Listing commits from $PREV_TAG to HEAD."
            LOG=$(git log --oneline "$PREV_TAG"..HEAD)
          fi

          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$LOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.changelog }}
          files: fancontrol
