# TerraMaster Fan Control Configuration
# Place this file at /etc/fancontrol.conf

[general]
# Enable debug logging (true/false)
debug = false

# Polling interval in seconds
interval = 10

[drives]
# Auto-detect drives (recommended)
# When enabled, the program will automatically find all HDDs, SSDs, and NVMe drives
auto_detect = true

# Include NVMe drives in monitoring
include_nvme = true

# Include HDD/SSD (SATA/SAS) drives in monitoring
include_hdd = true

# Don't wake sleeping SATA drives for temperature checks
# Sleeping drives are skipped (they are cool anyway)
respect_standby = true

# Manual drive list (disables auto_detect if specified)
# Uncomment and modify to manually specify drives
# drive_list = sda,sdb,sdc,sdd,nvme0n1

[fan_curve]
# Simple fan curve: linear interpolation between temp_low and temp_high
#
# How it works:
#   - Below temp_low:  fans run at fan_min (quiet)
#   - At temp_low:     fans run at fan_start
#   - At temp_high:    fans run at fan_max (full speed)
#   - Between:         linear interpolation
#
# Example with defaults (temp_low=40, temp_high=60):
#   35°C -> 31% (fan_min)
#   40°C -> 39% (fan_start)
#   50°C -> 70%
#   60°C -> 100% (fan_max)
#

# Temperature thresholds (Celsius)
temp_low = 40
temp_high = 60

# Fan speed limits (PWM: 0-255)
# fan_min: absolute minimum, fans never go below this (~31%)
fan_min = 80

# fan_start: speed at temp_low (~39%)
fan_start = 100

# fan_max: maximum speed at temp_high (100%)
fan_max = 255

[cpu]
# CPU temperature offset compared to drives
# (CPU is allowed to be this many degrees hotter)
cpu_temp_offset = 20

# Number of CPU temperature samples for rolling average
cpu_avg_samples = 10

[graphite]
# Graphite server for metrics (optional)
# Format: ip:port
# graphite_server = 192.168.1.100:2003
